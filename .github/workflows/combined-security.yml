name: DevSecOps Security POC

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk SAST scan
        id: sast
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

      - name: Snyk SCA scan
        id: sca
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high

      - name: GitGuardian secret scan
        id: secrets
        continue-on-error: true
        uses: GitGuardian/ggshield/actions/secret@v1.55.0
        with:
          args: --all-secrets
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GGSHIELD_TOKEN }}
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Start OWASP Juice Shop
        id: juice
        continue-on-error: true
        run: |
          docker run -d \
            --name juice-shop \
            -p 127.0.0.1:3000:3000 \
            bkimminich/juice-shop

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi
            sleep 5
          done

          echo "Juice Shop failed to start"
          exit 1

      - name: Run OWASP ZAP Baseline scan
        id: zap
        if: always() && steps.juice.outcome == 'success'
        continue-on-error: true
        run: |
          set -u

          mkdir -p "$GITHUB_WORKSPACE/zap-output"
          chmod 777 "$GITHUB_WORKSPACE/zap-output"

          docker pull ghcr.io/zaproxy/zaproxy:stable

          docker create \
            --name zap-scan \
            --network host \
            -v "$GITHUB_WORKSPACE/zap-output:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -m 3 \
            -J zap-report.json

          set +e
          docker start -a zap-scan
          rc=$?
          set -e

          echo "$rc" > "$GITHUB_WORKSPACE/zap-output/zap-status.txt"
          echo "ZAP container exit code: $rc"

          docker logs zap-scan || true
          ls -la "$GITHUB_WORKSPACE/zap-output"

          # The central quality gate decides the final result.
          exit 0

      - name: Central Security Quality Gate
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          SAST_RESULT: ${{ steps.sast.outcome }}
          SCA_RESULT: ${{ steps.sca.outcome }}
          SECRETS_RESULT: ${{ steps.secrets.outcome }}
          JUICE_RESULT: ${{ steps.juice.outcome }}
          ZAP_RESULT: ${{ steps.zap.outcome }}
        run: |
          set -u
          failed=0

          echo "Checking dependency installation..."
          if [ "$INSTALL_RESULT" != "success" ]; then
            echo "FAIL: Dependency installation failed"
            failed=1
          fi

          echo "Checking Snyk SAST..."
          if [ "$SAST_RESULT" != "success" ]; then
            echo "FAIL: Snyk SAST found blocking findings"
            failed=1
          fi

          echo "Checking Snyk SCA..."
          if [ "$SCA_RESULT" != "success" ]; then
            echo "FAIL: Snyk SCA found blocking findings"
            failed=1
          fi

          echo "Checking GitGuardian..."
          if [ "$SECRETS_RESULT" != "success" ]; then
            echo "FAIL: GitGuardian secret scan failed"
            failed=1
          fi

          echo "Checking Juice Shop..."
          if [ "$JUICE_RESULT" != "success" ]; then
            echo "FAIL: Juice Shop failed to start"
            failed=1
          fi

          echo "Checking ZAP execution..."
          if [ "$ZAP_RESULT" != "success" ]; then
            echo "FAIL: ZAP scan step failed"
            failed=1
          fi

          REPORT="$GITHUB_WORKSPACE/zap-output/zap-report.json"
          STATUS="$GITHUB_WORKSPACE/zap-output/zap-status.txt"

          echo "Checking ZAP DAST results..."

          if [ ! -s "$REPORT" ] || [ ! -s "$STATUS" ]; then
            echo "FAIL: ZAP report or status is missing"
            failed=1

          elif ! jq -e '.site | type == "array"' "$REPORT" >/dev/null 2>&1; then
            echo "FAIL: ZAP report is invalid"
            failed=1

          else
            zap_rc=$(cat "$STATUS")

            if ! [[ "$zap_rc" =~ ^[0-9]+$ ]]; then
              echo "FAIL: Invalid ZAP exit status"
              failed=1

            elif [ "$zap_rc" -eq 3 ]; then
              echo "FAIL: ZAP encountered a scan error"
              failed=1

            else
              # ZAP riskcode 3 represents High risk.
              high_count=$(jq \
                '[.site[]?.alerts[]? |
                  select((.riskcode | tostring) == "3")] | length' \
                "$REPORT")

              if [ "$high_count" -gt 0 ]; then
                echo "FAIL: ZAP reported $high_count High-risk alert(s)"
                failed=1

              elif [ "$zap_rc" -eq 1 ]; then
                echo "FAIL: ZAP reported FAIL alerts"
                failed=1

              elif [ "$zap_rc" -eq 2 ]; then
                echo "PASS: ZAP reported warnings only"
              
              elif [ "$zap_rc" -eq 0 ]; then
                echo "PASS: ZAP completed without FAIL or WARN alerts"

              else
                echo "FAIL: Unexpected ZAP exit code $zap_rc"
                failed=1
              fi
            fi
          fi

          echo "------------------------------------"

          if [ "$failed" -ne 0 ]; then
            echo "SECURITY QUALITY GATE: FAILED"
            exit 1
          fi

          echo "SECURITY QUALITY GATE: PASSED"

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-output/
          if-no-files-found: warn

      - name: Clean up containers
        if: always()
        run: |
          docker rm -f zap-scan juice-shop 2>/dev/null || true
