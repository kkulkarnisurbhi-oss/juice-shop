
name: Combined DevSecOps Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  # ==================================================
  # 1. SAST + SCA - SNYK
  # ==================================================
  snyk-security:
    name: Snyk SAST and SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare results
        run: |
          mkdir -p results
          echo "not_run" > results/snyk-code-status.txt
          echo "not_run" > results/snyk-sca-status.txt

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: SAST - Snyk Code
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk code test \
            --severity-threshold=high \
            --json-file-output=results/snyk-code.json \
            --sarif-file-output=results/snyk-code.sarif
          rc=$?
          echo "$rc" > results/snyk-code-status.txt
          exit 0

      - name: SCA - Snyk Open Source
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk test \
            --severity-threshold=high \
            --json-file-output=results/snyk-sca.json \
            --sarif-file-output=results/snyk-sca.sarif
          rc=$?
          echo "$rc" > results/snyk-sca-status.txt
          exit 0

      - name: Upload Snyk SAST SARIF
        if: always() && hashFiles('results/snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/snyk-code.sarif
          category: snyk-code

      - name: Upload Snyk SCA SARIF
        if: always() && hashFiles('results/snyk-sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/snyk-sca.sarif
          category: snyk-sca

      - name: Monitor project in Snyk
        if: always()
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor

      - name: Upload Snyk reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: results/
          if-no-files-found: warn
          retention-days: 7

  # ==================================================
  # 2. SECRET SCANNING - GITGUARDIAN
  # ==================================================
  secrets:
    name: Secret Scan - GitGuardian
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        id: gg
        continue-on-error: true
        uses: GitGuardian/ggshield/actions/secret@v1.55.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Record scan outcome
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.gg.outcome }}
        run: |
          mkdir -p results
          echo "$SCAN_OUTCOME" > results/gitguardian-status.txt

      - name: Upload GitGuardian results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-results
          path: results/
          if-no-files-found: warn
          retention-days: 7

  # ==================================================
  # 3. DAST - OWASP ZAP + JUICE SHOP
  # ==================================================
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Prepare results directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/results"
          chmod 777 "$GITHUB_WORKSPACE/results"
          echo "not_run" > results/zap-status.txt

      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 127.0.0.1:3000:3000 \
            bkimminich/juice-shop

      - name: Wait for Juice Shop
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Juice Shop failed to start"
          exit 1

      - name: Run OWASP ZAP Baseline
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable

          docker create \
            --name zap-scan \
            --network host \
            -v "$GITHUB_WORKSPACE/results:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -m 3 \
            -J zap-report.json

          set +e
          docker start -a zap-scan
          rc=$?
          echo "$rc" > results/zap-status.txt
          exit 0

      - name: Upload ZAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-results
          path: results/
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up containers
        if: always()
        run: docker rm -f zap-scan juice-shop || true

  # ==================================================
  # 4. SINGLE FINAL QUALITY GATE
  # ==================================================
  quality-gate:
    name: Final Security Quality Gate
    runs-on: ubuntu-latest
    needs: [snyk-security, secrets, dast]
    if: always()

    steps:
      - name: Download Snyk reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: snyk-results
          path: all-results/snyk

      - name: Download GitGuardian results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: secrets-results
          path: all-results/secrets

      - name: Download ZAP results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dast-results
          path: all-results/dast

      - name: Evaluate security policy
        env:
          SNYK_JOB: ${{ needs.snyk-security.result }}
          SECRETS_JOB: ${{ needs.secrets.result }}
          DAST_JOB: ${{ needs.dast.result }}
        shell: bash
        run: |
          set -u
          failed=0

          # Scanner job failures block the pipeline.
          for status in "$SNYK_JOB" "$SECRETS_JOB" "$DAST_JOB"; do
            if [ "$status" != "success" ]; then
              echo "BLOCKED: Scanner job failed: $status"
              failed=1
            fi
          done

          # Snyk SAST: CLI threshold is High or above.
          S=all-results/snyk/snyk-code-status.txt
          J=all-results/snyk/snyk-code.json

          if [ ! -f "$S" ] || [ ! -f "$J" ]; then
            echo "BLOCKED: Snyk Code results missing"
            failed=1
          else
            rc=$(cat "$S" | tr -d '[:space:]')
            if [ "$rc" != "0" ]; then
              echo "BLOCKED: Snyk Code found blocking issues or failed"
              failed=1
            fi
          fi

          # Snyk SCA: CLI threshold is High or above.
          S=all-results/snyk/snyk-sca-status.txt
          J=all-results/snyk/snyk-sca.json

          if [ ! -f "$S" ] || [ ! -f "$J" ]; then
            echo "BLOCKED: Snyk SCA results missing"
            failed=1
          else
            rc=$(cat "$S" | tr -d '[:space:]')
            if [ "$rc" != "0" ]; then
              echo "BLOCKED: Snyk SCA found blocking issues or failed"
              failed=1
            fi
          fi

          # GitGuardian: any detected secret or scan failure blocks.
          S=all-results/secrets/gitguardian-status.txt

          if [ ! -f "$S" ] ||
             [ "$(cat "$S" | tr -d '[:space:]')" != "success" ]; then
            echo "BLOCKED: GitGuardian failed or detected secrets"
            failed=1
          fi

          # ZAP: block on High alerts or scan execution errors.
          S=all-results/dast/zap-status.txt
          J=all-results/dast/zap-report.json

          if [ ! -f "$S" ] || [ ! -f "$J" ]; then
            echo "BLOCKED: ZAP results missing"
            failed=1
          elif ! jq -e 'type == "object" and
                         (.site | type == "array")' "$J" >/dev/null; then
            echo "BLOCKED: Invalid ZAP report"
            failed=1
          else
            rc=$(cat "$S" | tr -d '[:space:]')

            if ! [[ "$rc" =~ ^[0-9]+$ ]] || [ "$rc" -ge 2 ]; then
              echo "BLOCKED: ZAP scan failed"
              failed=1
            else
              count=$(jq \
                '[.site[]?.alerts[]? |
                  select((.riskcode | tostring) == "3")] | length' \
                "$J")

              echo "ZAP High alerts: $count"
              [ "$count" -eq 0 ] || failed=1
            fi
          fi

          if [ "$failed" -ne 0 ]; then
            echo "SECURITY QUALITY GATE: FAILED"
            exit 1
          fi

          echo "SECURITY QUALITY GATE: PASSED"
