
name: OWASP ZAP DAST - Juice Shop

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    name: DAST - OWASP ZAP on Juice Shop
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Start Juice Shop
      - name: Start OWASP Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 127.0.0.1:3000:3000 \
            bkimminich/juice-shop

      # 3. Wait until Juice Shop is ready
      - name: Wait for Juice Shop
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ \
              -o /dev/null; then
              echo "Juice Shop is ready!"
              exit 0
            fi

            echo "Waiting for Juice Shop..."
            sleep 2
          done

          echo "Juice Shop failed to start"
          docker logs juice-shop
          exit 1

      # 4. Prepare a writable directory for ZAP reports
      - name: Prepare ZAP output directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zap-output"
          chmod 777 "$GITHUB_WORKSPACE/zap-output"

      # 5. Run OWASP ZAP Baseline Scan
      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE/zap-output:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -m 3 \
            -J zap-report.json

      # 6. Upload JSON report even if the scan fails
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-output/zap-report.json
          if-no-files-found: warn
          retention-days: 7

      # 7. Clean up Juice Shop
      - name: Stop Juice Shop
        if: always()
        run: docker rm -f juice-shop || true
