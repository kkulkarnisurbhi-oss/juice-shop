
name: OWASP ZAP DAST - Juice Shop

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    name: DAST - OWASP ZAP on Juice Shop
    runs-on: ubuntu-latest

    steps:
      # 1. Start Juice Shop
      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 127.0.0.1:3000:3000 \
            bkimminich/juice-shop

      # 2. Wait for Juice Shop to become ready
      - name: Wait for Juice Shop
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ \
              -o /dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Juice Shop failed to start"
          docker logs juice-shop
          exit 1

      # 3. Create a ZAP container
      - name: Prepare ZAP container
        run: |
          mkdir -p zap-output

          docker pull ghcr.io/zaproxy/zaproxy:stable

          docker create \
            --name zap-scan \
            --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -m 3 \
            -J /zap/wrk/zap-report.json

      # 4. Run the scan and capture its exit code
      - name: Run ZAP Baseline Scan
        id: zap
        shell: bash
        run: |
          set +e
          docker start -a zap-scan
          rc=$?
          set -e

          echo "ZAP exit code: $rc"
          echo "$rc" > zap-output/zap-status.txt

          # Preserve the scan result for debugging.
          exit 0

      # 5. Collect diagnostic information and reports
      - name: Debug ZAP and collect report
        if: always()
        shell: bash
        run: |
          echo "===== Containers ====="
          docker ps -a || true

          echo "===== ZAP logs ====="
          docker logs zap-scan || true

          echo "===== Juice Shop logs ====="
          docker logs juice-shop || true

          echo "===== Copy ZAP report ====="
          if docker cp \
            zap-scan:/zap/wrk/zap-report.json \
            zap-output/zap-report.json; then
            echo "ZAP JSON report copied successfully"
          else
            echo "ZAP JSON report was not generated"
          fi

          echo "===== Output directory ====="
          ls -la zap-output || true

      # 6. Upload reports even if the scan fails
      - name: Upload ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: zap-output/
          if-no-files-found: warn
          retention-days: 7

      # 7. Clean up
      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f zap-scan juice-shop || true
