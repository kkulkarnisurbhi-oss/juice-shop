
name: OWASP ZAP DAST - Juice Shop

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    name: DAST - OWASP ZAP on Juice Shop
    runs-on: ubuntu-latest

    steps:
      # 1. Start the Juice Shop application
      - name: Start OWASP Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 127.0.0.1:3000:3000 \
            bkimminich/juice-shop

      # 2. Wait until the application is ready
      - name: Wait for Juice Shop
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ \
              -o /dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi

            echo "Waiting for Juice Shop..."
            sleep 2
          done

          echo "Juice Shop failed to start"
          docker logs juice-shop
          exit 1

      # 3. Create a writable directory for ZAP reports
      - name: Prepare ZAP output directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zap-output"
          chmod 777 "$GITHUB_WORKSPACE/zap-output"

      # 4. Create the ZAP container with the output directory mounted
      - name: Prepare ZAP container
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable

          docker create \
            --name zap-scan \
            --network host \
            -v "$GITHUB_WORKSPACE/zap-output:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -m 3 \
            -J zap-report.json

      # 5. Run the scan and preserve its exit code
      - name: Run OWASP ZAP Baseline Scan
        shell: bash
        run: |
          set +e
          docker start -a zap-scan
          rc=$?
          set -e

          echo "$rc" > zap-output/zap-status.txt
          echo "ZAP exit code: $rc"

          # Allow report upload and cleanup even if ZAP returns nonzero.
          exit 0

      # 6. Inspect reports and logs for troubleshooting
      - name: Debug ZAP results
        if: always()
        shell: bash
        run: |
          echo "===== ZAP container logs ====="
          docker logs zap-scan || true

          echo "===== Juice Shop logs ====="
          docker logs juice-shop || true

          echo "===== ZAP output files ====="
          ls -la zap-output || true

          if [ -f zap-output/zap-report.json ]; then
            echo "ZAP JSON report generated successfully"
          else
            echo "ZAP JSON report is missing"
          fi

      # 7. Upload reports
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: zap-output/
          if-no-files-found: warn
          retention-days: 7

      # 8. Clean up both containers
      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f zap-scan juice-shop || true
