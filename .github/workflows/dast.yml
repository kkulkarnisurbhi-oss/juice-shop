
name: OWASP ZAP DAST - Juice Shop

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    name: DAST - OWASP ZAP on Juice Shop
    runs-on: ubuntu-latest

    steps:
      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 127.0.0.1:3000:3000 \
            bkimminich/juice-shop

      - name: Wait for Juice Shop
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs juice-shop
          exit 1

      - name: Run ZAP and export JSON report
        shell: bash
        run: |
          set -e

          docker pull ghcr.io/zaproxy/zaproxy:stable

          docker create \
            --name zap-scan \
            --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -m 3 \
            -J /tmp/zap-report.json

          set +e
          docker start -a zap-scan
          zap_rc=$?
          set -e

          echo "ZAP exit code: $zap_rc"

          mkdir -p zap-output

          if docker cp zap-scan:/tmp/zap-report.json zap-output/zap-report.json; then
            echo "JSON report copied successfully"
          else
            echo "ZAP did not create its JSON report"
            docker logs zap-scan || true
            exit 1
          fi

          echo "$zap_rc" > zap-output/zap-status.txt

          # Let the workflow upload the report before evaluating the scan.
          if [ "$zap_rc" -ne 0 ]; then
            echo "ZAP scan returned exit code $zap_rc"
          fi

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f juice-shop zap-scan || true
